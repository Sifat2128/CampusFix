version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: campusfix_db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-campusfix_secret}
      POSTGRES_DB: ${DATABASE_NAME:-campusfix}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-campusfix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: campusfix_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-campusfix}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-campusfix_secret}
      - SECRET_KEY=${SECRET_KEY:-campusfix_super_secure_key_2026}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - ADMIN_ONE=${ADMIN_ONE:-sifatahasan2108@gmail.com}
      - ADMIN_TWO=${ADMIN_TWO:-sejutimona2108@gmail.com}
      - ENVIRONMENT=production
      - CORS_ORIGINS=*

volumes:
  postgres_data:
